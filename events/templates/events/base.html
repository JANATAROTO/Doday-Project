{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Doday{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'events/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="header-row">
            <a class="brand" href="{% url 'events:event_list' %}">Doday</a>
            <div class="auth-status">
                {% if user.is_authenticated %}
                    <span>Hi, {{ user.username }}</span>
                    <form method="post" action="{% url 'logout' %}" class="logout-form">
                        {% csrf_token %}
                        <button type="submit" class="link-button">Log out</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Log in</a>
                    <a href="{% url 'signup' %}">Sign up</a>
                {% endif %}
            </div>
        </div>
        <p class="tagline">Find events in Medellín</p>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <p>Doday — academic project</p>
    </footer>
</body>
</html>
