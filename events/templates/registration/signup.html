{% extends "events/base.html" %}

{% block title %}Sign up — Doday{% endblock %}

{% block content %}
<h1>Create your account</h1>

<form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign up</button>
</form>

<p class="event-meta"><a href="{% url 'login' %}">Already have an account? Log in</a></p>
{% endblock %}
