{% extends "events/base.html" %}
{% load i18n %}

{% block title %}{% translate "Sign up" %} — Doday{% endblock %}

{% block content %}
<h1>{% translate "Create your account" %}</h1>

<form method="post" class="auth-form form-card">
    {% csrf_token %}
    {{ form.as_div }}
    <div class="form-actions">
        <button type="submit">{% translate "Sign up" %}</button>
    </div>
    <p class="form-footer"><a href="{% url 'login' %}">{% translate "Already have an account? Log in" %}</a></p>
</form>
{% endblock %}
