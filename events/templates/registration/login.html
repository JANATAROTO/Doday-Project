{% extends "events/base.html" %}
{% load i18n %}

{% block title %}{% translate "Log in" %} — Doday{% endblock %}

{% block content %}
<h1>{% translate "Log in" %}</h1>

<form method="post" class="auth-form form-card">
    {% csrf_token %}
    {{ form.as_div }}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="form-actions">
        <button type="submit">{% translate "Log in" %}</button>
    </div>
    <p class="form-footer"><a href="{% url 'signup' %}">{% translate "Don't have an account? Sign up" %}</a></p>
</form>
{% endblock %}
